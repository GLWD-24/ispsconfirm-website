<!-- ISPS-ONBOARD-001 §1 — vaste bestemming van de gedrukte QR (poster/sticker,
     ISPS-POSTER-001). Deze pagina doet niets anders dan doorsturen naar de app:
     het drukwerk wijst hierheen en hoeft dus nooit vervangen te worden wanneer
     de app-URL wijzigt. Alleen de APP_URL onderaan aanpassen. -->
<style>
  :root{--bg:#FAF9F6;--accent:#E8650F;--text:#16181D;--text-dim:#5D6066}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;
    font-family:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.6;
    -webkit-font-smoothing:antialiased;padding:24px}
  .card{text-align:center;max-width:420px}
  h1{font-size:22px;margin-bottom:8px}
  p{color:var(--text-dim);font-size:15px;margin-bottom:20px}
  a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
    font-weight:600;padding:14px 26px;border-radius:10px}
</style>
</head>
<body>
  <!-- Alleen zichtbaar als de directe redirect niet uitvoert (JS uit / trage lading). -->
  <div class="card">
    <h1>Je pas aanmaken</h1>
    <p>We sturen je door naar de beveiligde app van isps.confirm. Gaat dat niet vanzelf, tik dan op de knop.</p>
    <a class="btn" id="go" href="#">Verder naar de app</a>
  </div>
<script>
// Bestemming van de gedrukte QR — het ENIGE dat hier ooit wijzigt (ISPS-ONBOARD-001 §1).
var APP_URL = 'https://app.ispsconfirm.com/onboard';
document.getElementById('go').href = APP_URL;
location.replace(APP_URL);
</script>
</body>
